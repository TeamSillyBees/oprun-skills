name: Publish Skills to npm

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: oprun-skills-npm
  queue: max

jobs:
  publish:
    if: >-
      github.repository == 'TeamSillyBees/oprun-skills' &&
      !github.event.release.draft &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*' \
            --dir "$RUNNER_TEMP/oprun-release" -- "$RELEASE_TAG"
      - name: Verify assets and publish with npm Trusted Publishing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 tools/publish_npm.py --directory "$RUNNER_TEMP/oprun-release" --tag "$RELEASE_TAG"
